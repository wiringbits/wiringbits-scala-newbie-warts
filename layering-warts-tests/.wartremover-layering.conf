roots = ["fixture.layering"]
layers = [
  { name = controllers,  packages = ["fixture.layering.controllers"],          calls = [actions, repositories, shared] }
  { name = actions,      packages = ["fixture.layering.actions"],              calls = [repositories, shared] }
  { name = repositories, packages = ["fixture.layering.repositories"],         calls = [daos, shared] }
  { name = daos,         packages = ["fixture.layering.repositories.daos"],    calls = [daos, shared] }
  { name = shared,       packages = ["fixture.layering.models", "fixture.layering.repositories.models"], calls = [shared] }
]
