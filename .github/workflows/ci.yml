name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # jvm: system reuses the JDK above so coursier never fetches its flaky JVM index.
      - name: Setup sbt
        uses: coursier/setup-action@v3
        with:
          jvm: system
          apps: sbt

      - name: Check code format
        run: sbt scalafmtCheckAll

      - name: Compile
        run: sbt compile

      - name: Run tests
        run: sbt test
