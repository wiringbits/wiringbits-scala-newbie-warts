name: Release
on:
  push:
    branches: [master, main]
    tags: ["*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      # The sbt launcher comes from Maven Central, which avoids depending on GitHub release downloads.
      # It reads project/build.properties to fetch the sbt version used by the build.
      - name: Setup sbt
        run: |
          mkdir -p "$HOME/sbt/bin"
          curl -fsSL --retry 5 -o "$HOME/sbt/bin/sbt-launch.jar" \
            https://repo1.maven.org/maven2/org/scala-sbt/sbt-launch/1.13.1/sbt-launch-1.13.1.jar
          printf '#!/bin/sh\nexec java -Xss4m -jar "%s" "$@"\n' "$HOME/sbt/bin/sbt-launch.jar" > "$HOME/sbt/bin/sbt"
          chmod +x "$HOME/sbt/bin/sbt"
          echo "$HOME/sbt/bin" >> "$GITHUB_PATH"
      - run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
